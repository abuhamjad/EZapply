$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/product-type/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "company_id": 1,
        "display_order": 1,
        "is_active": true,
        "is_combo": false,
        "location_id": 1,
        "sale_tab_id": 1,
        "track_inventory": false
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
