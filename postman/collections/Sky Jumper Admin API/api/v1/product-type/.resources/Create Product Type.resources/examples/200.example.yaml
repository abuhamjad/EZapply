$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/product-type"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "company_id": 1,
        "display_order": 1,
        "is_active": true,
        "is_combo": false,
        "sale_tab_id": 1,
        "track_inventory": false,
        "week_list": "All Days"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
