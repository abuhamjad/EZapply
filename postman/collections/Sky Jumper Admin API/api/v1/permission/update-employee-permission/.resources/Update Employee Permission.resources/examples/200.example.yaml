$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/permission/update-employee-permission"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "employee_id": 1,
        "is_active": 1,
        "route_id": 1,
        "type": "route"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
