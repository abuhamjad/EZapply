$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/permission/add-routes"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "company_id": 1,
        "is_active": 1,
        "module_id": 1,
        "name": "Get Reports",
        "route": "/reports/get-summary"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
