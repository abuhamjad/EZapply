$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/permission/get-module"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "is_active": 1,
        "limit": 10,
        "pageNumber": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
