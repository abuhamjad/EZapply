$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/reset-password"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "currentPassword": "password123",
        "password": "newPassword123",
        "user_id": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
