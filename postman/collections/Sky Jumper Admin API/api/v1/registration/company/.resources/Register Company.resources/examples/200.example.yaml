$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/registration/company"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "address": "123 Business Park",
        "city_id": 1,
        "contact_person_name": "Jane Smith",
        "email": "contact@skyjumper.com",
        "is_active": true,
        "mobile": "9876543210",
        "name": "Sky Jumper",
        "pincode": "400001",
        "state_id": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
