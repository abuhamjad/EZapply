$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/registration/customer"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "city_id": 1,
        "company_id": 1,
        "date_of_birth": "1995-05-10",
        "email": "alice@example.com",
        "first_name": "Alice",
        "gender": "female",
        "is_active": true,
        "last_name": "Brown",
        "mobile": "9876543210",
        "state_id": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
