$kind: http-request
description: Add Receipt Setting
url: "{{baseUrl}}/api/v1/receipt"
method: POST
headers:
  Content-Type: multipart/form-data
body:
  type: formdata
  content:
    - type: text
      key: company_id
      value: "1"
    - type: text
      key: data
      value: "{}"
    - type: text
      key: is_active
      value: "1"
    - type: file
      key: logo
      src: []
settings: {}
examples: ./.resources/Add Receipt Setting.resources/examples
order: 2000
