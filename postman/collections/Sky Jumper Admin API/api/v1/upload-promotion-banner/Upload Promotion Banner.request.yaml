$kind: http-request
description: Upload Promotion Banner
url: "{{baseUrl}}/api/v1/upload-promotion-banner"
method: POST
headers:
  Content-Type: multipart/form-data
body:
  type: formdata
  content:
    - type: file
      key: banner
      src: []
    - type: text
      key: company_id
      value: "1"
settings: {}
examples: ./.resources/Upload Promotion Banner.resources/examples
order: 1000
