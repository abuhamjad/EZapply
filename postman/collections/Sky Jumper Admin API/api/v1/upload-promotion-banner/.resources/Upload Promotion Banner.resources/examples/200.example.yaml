$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/upload-promotion-banner"
  method: POST
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: formdata
    content:
      - type: file
        key: banner
        src: []
      - type: text
        key: company_id
        value: "1"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
