$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/create-package"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount_per_person": 500,
        "company_id": 1,
        "description": "Birthday party package",
        "is_active": true,
        "is_multiple": 0,
        "location_id": "1,2",
        "name": "Birthday Package",
        "special_price": 450,
        "time": 60,
        "type": "food",
        "weekend_addon_amount": 50
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
