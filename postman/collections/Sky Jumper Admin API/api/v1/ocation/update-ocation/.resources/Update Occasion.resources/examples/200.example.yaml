$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/ocation/update-ocation"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "date": "2026-08-15",
        "id": 1,
        "location_id": 1,
        "name": "Independence Day Updated"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
