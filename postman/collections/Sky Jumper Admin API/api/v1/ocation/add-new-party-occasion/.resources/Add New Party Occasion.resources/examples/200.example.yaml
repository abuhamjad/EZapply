$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/ocation/add-new-party-occasion"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "date": "2026-08-15",
        "location_id": 1,
        "name": "Birthday Bash"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
