$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/add-activity-product"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "activity_type_id": 1,
        "amount": 300,
        "display_order": 1,
        "is_multiple": 0,
        "name": "Trampoline Jump",
        "play_point": 10,
        "special_price": 250,
        "tax_rate_id": 1,
        "time": 30
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
