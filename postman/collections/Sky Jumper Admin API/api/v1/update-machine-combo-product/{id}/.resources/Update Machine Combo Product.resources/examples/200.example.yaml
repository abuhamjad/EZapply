$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/update-machine-combo-product/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "amount": 800,
        "combo_name": "Combo Machine A Updated",
        "is_active": true,
        "special_price": 700,
        "sub_products": [
          1,
          2
        ]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
