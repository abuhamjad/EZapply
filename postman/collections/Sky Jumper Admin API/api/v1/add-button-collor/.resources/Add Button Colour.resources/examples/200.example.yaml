$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/add-button-collor"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "code": "#FF0000",
        "company_id": 1,
        "is_active": true,
        "name": "Red"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
