$kind: http-request
description: Create Addon
url: "{{baseUrl}}/api/v1/create-addon"
method: POST
headers:
  Content-Type: multipart/form-data
body:
  type: formdata
  content:
    - type: text
      key: amount
      value: "50"
    - type: text
      key: company_id
      value: "1"
    - type: file
      key: image
      src: []
    - type: text
      key: is_multiple
      value: "0"
    - type: text
      key: location_id
      value: 1,2
    - type: text
      key: name
      value: Extra Socks
    - type: text
      key: tax_rate_id
      value: "1"
    - type: text
      key: type
      value: addon
settings: {}
examples: ./.resources/Create Addon.resources/examples
order: 1000
