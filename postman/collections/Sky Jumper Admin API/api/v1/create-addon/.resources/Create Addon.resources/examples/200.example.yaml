$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/create-addon"
  method: POST
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: formdata
    content:
      - type: text
        key: amount
        value: "50"
      - type: text
        key: company_id
        value: "1"
      - type: file
        key: image
        src: []
      - type: text
        key: is_multiple
        value: "0"
      - type: text
        key: location_id
        value: 1,2
      - type: text
        key: name
        value: Extra Socks
      - type: text
        key: tax_rate_id
        value: "1"
      - type: text
        key: type
        value: addon
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
