$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/employees/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "address": "123 Street",
        "city_id": 1,
        "company_id": 1,
        "email": "john.doe@example.com",
        "first_name": "John",
        "is_active": true,
        "last_name": "Doe",
        "phone_no": "9876543210",
        "pincode": 400001,
        "state_id": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
