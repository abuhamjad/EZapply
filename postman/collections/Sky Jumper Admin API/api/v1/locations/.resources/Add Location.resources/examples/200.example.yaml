$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/locations"
  method: POST
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: formdata
    content:
      - type: text
        key: address
        value: 123 Mall Road
      - type: file
        key: brand_image
        src: []
      - type: text
        key: company_id
        value: "1"
      - type: text
        key: country_id
        value: "1"
      - type: text
        key: email
        value: location@example.com
      - type: text
        key: gst_no
        value: 27AAAAA0000A1Z5
      - type: text
        key: is_active
        value: "true"
      - type: file
        key: logo
        src: []
      - type: text
        key: name
        value: Sky Jumper Andheri
      - type: text
        key: phone_no
        value: "9876543210"
      - type: text
        key: pincode
        value: "400001"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
