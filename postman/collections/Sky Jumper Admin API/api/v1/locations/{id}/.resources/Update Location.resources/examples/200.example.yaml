$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/locations/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: formdata
    content:
      - type: text
        key: address
        value: 123 Mall Road
      - type: file
        key: brand_image
        src: []
      - type: text
        key: is_active
        value: "true"
      - type: file
        key: logo
        src: []
      - type: text
        key: name
        value: Sky Jumper Andheri Updated
      - type: text
        key: phone_no
        value: "9876543210"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
