$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/unit-master/:id"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "is_active": true,
        "multiplier": 1,
        "name": "kg",
        "type": "weight"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
