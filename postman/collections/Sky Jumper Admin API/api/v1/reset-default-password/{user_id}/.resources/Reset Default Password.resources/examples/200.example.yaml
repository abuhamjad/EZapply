$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/reset-default-password/:user_id"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    user_id: "1"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
