$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/reports/get-customer-details-report-on-visit"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "page": 1,
        "page_size": 10,
        "range_type": "exact"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
