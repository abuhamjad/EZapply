$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/loyality-points"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "company_id": 1,
        "is_active": true,
        "loyality_program": 1,
        "play_point_spent": 100
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
