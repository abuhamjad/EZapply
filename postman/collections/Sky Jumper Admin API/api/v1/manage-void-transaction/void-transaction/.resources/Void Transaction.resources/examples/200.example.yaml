$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/manage-void-transaction/void-transaction"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "reason": "Customer request",
        "transaction_id": 1,
        "transaction_type": "order",
        "voided_by": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
