$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/manage-void-transaction/get-transactions"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "page_no": 1,
        "page_size": 10,
        "transaction_type": "order"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
