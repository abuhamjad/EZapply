$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/products/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: json
    content: |-
      {
        "amount": 500,
        "display_order": 1,
        "is_active": true,
        "name": "Trampoline Session Updated",
        "payment_type_id": 1,
        "product_type_id": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
