$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/products"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 500,
        "company_id": 1,
        "description": "30 min session",
        "display_order": 1,
        "is_active": true,
        "is_combo": false,
        "is_recipe": false,
        "name": "Trampoline Session",
        "payment_type_id": 1,
        "product_type_id": 1,
        "time": 30,
        "track_inventory": false
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
