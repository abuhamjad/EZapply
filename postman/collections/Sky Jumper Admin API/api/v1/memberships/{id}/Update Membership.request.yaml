$kind: http-request
description: Update Membership
url: "{{baseUrl}}/api/v1/memberships/:id"
method: PUT
headers:
  Content-Type: multipart/form-data
pathVariables:
  id: "1"
body:
  type: formdata
  content:
    - type: text
      key: duration
      value: "12"
    - type: text
      key: is_active
      value: "true"
    - type: file
      key: logo
      src: []
    - type: text
      key: name
      value: Gold Membership Updated
    - type: text
      key: price
      value: "5000"
    - type: text
      key: tax_rate_id
      value: "1"
settings: {}
examples: ./.resources/Update Membership.resources/examples
order: 1000
