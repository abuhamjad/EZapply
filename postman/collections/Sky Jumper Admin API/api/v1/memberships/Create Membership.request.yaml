$kind: http-request
description: Create Membership
url: "{{baseUrl}}/api/v1/memberships"
method: POST
headers:
  Content-Type: multipart/form-data
body:
  type: formdata
  content:
    - type: text
      key: company_id
      value: "1"
    - type: text
      key: duration
      value: "12"
    - type: text
      key: is_active
      value: "true"
    - type: file
      key: logo
      src: []
    - type: text
      key: name
      value: Gold Membership
    - type: text
      key: price
      value: "5000"
    - type: text
      key: tax_rate_id
      value: "1"
settings: {}
examples: ./.resources/Create Membership.resources/examples
order: 2000
