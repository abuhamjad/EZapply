$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/update-activity-product-type/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: formdata
    content:
      - type: text
        key: display_order
        value: "1"
      - type: file
        key: icon
        src: []
      - type: text
        key: name
        value: Trampoline Updated
      - type: text
        key: week_list
        value: All Days
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
