$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/machine/update/:machine_id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    machine_id: "1"
  body:
    type: json
    content: |-
      {
        "animation": "red",
        "location_id": 1,
        "machine_name": "Trampoline Machine 1 Updated",
        "product_id": 1,
        "type": "trampoline"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
