$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/machine/add"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "animation": "green",
        "location_id": 1,
        "machine_id": "M001",
        "machine_name": "Trampoline Machine 1",
        "product_id": 1,
        "type": "trampoline"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
