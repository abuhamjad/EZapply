$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/update-inventory-location-mapping"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "inventory_product_id": 1,
        "is_active": true,
        "location_id": 1,
        "opening_stock": 0,
        "price": 10,
        "unit_id": 1,
        "uom_qty": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
