$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/update-combo-product"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 1000,
        "combo_name": "Combo A Updated",
        "id": 1,
        "is_active": true,
        "special_price": 900,
        "sub_products": [
          1,
          2
        ]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
