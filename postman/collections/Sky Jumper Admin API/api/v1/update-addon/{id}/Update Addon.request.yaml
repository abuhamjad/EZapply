$kind: http-request
description: Update Addon
url: "{{baseUrl}}/api/v1/update-addon/:id"
method: PUT
headers:
  Content-Type: multipart/form-data
pathVariables:
  id: "1"
body:
  type: formdata
  content:
    - type: text
      key: amount
      value: "60"
    - type: file
      key: image
      src: []
    - type: text
      key: name
      value: Extra Socks Updated
settings: {}
examples: ./.resources/Update Addon.resources/examples
order: 1000
