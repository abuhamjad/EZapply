$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/update-addon/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "1"
  body:
    type: formdata
    content:
      - type: text
        key: amount
        value: "60"
      - type: file
        key: image
        src: []
      - type: text
        key: name
        value: Extra Socks Updated
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
