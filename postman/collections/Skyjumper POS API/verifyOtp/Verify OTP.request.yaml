$kind: http-request
description: Verify OTP
url: "{{baseUrl}}/verifyOtp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mobile": "9876543210",
      "otp": "123456"
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Verify OTP.resources/examples
order: 1000
