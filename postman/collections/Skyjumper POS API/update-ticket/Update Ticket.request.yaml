$kind: http-request
description: Update Ticket
url: "{{baseUrl}}/update-ticket"
method: POST
headers:
  api-x-key: "{{api_x_key}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "card_no": "1000000001",
      "ticket": 10
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Update Ticket.resources/examples
order: 1000
