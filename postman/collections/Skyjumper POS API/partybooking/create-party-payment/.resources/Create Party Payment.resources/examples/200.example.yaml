$kind: http-example
request:
  url: "{{baseUrl}}/partybooking/create-party-payment"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 100,
        "customer_id": 1,
        "location_id": 1,
        "party_id": 1,
        "payment_type_id": 1,
        "type": ""
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
