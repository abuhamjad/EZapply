$kind: http-example
request:
  url: "{{baseUrl}}/partybooking/issue-party-card"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "card_no": "1000000001",
        "is_extra": 0,
        "load_id": 1,
        "party_id": 1,
        "waiver_id": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
