$kind: http-example
request:
  url: "{{baseUrl}}/reports/get-not-claimed-card"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "end_date": "2026-07-14",
        "limit": 10,
        "page": 1,
        "phone_no": "9876543210",
        "start_date": "2026-07-01"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
