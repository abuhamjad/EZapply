$kind: http-example
request:
  url: "{{baseUrl}}/Support/createTicket"
  method: POST
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: formdata
    content:
      - type: text
        key: catageryId
        value: "1"
      - type: file
        key: file
        src: []
      - type: text
        key: message
        value: Issue description
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
