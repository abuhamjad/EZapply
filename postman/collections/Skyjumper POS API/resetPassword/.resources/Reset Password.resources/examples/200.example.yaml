$kind: http-example
request:
  url: "{{baseUrl}}/resetPassword"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "currentPassword": "OldPassword123",
        "id": 1,
        "password": "Password123"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
