$kind: http-request
description: Reset Password
url: "{{baseUrl}}/resetPassword"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "OldPassword123",
      "id": 1,
      "password": "Password123"
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Reset Password.resources/examples
order: 1000
