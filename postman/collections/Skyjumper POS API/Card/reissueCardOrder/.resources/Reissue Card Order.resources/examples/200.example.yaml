$kind: http-example
request:
  url: "{{baseUrl}}/Card/reissueCardOrder"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 100,
        "card_no": "1000000001",
        "payment_type_id": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
