$kind: http-example
request:
  url: "{{baseUrl}}/Card/reIssueCard"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "card_id": 1,
        "newCardNo": "1000000002",
        "oldcardNo": "1000000001"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
