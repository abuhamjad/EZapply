$kind: http-example
request:
  url: "{{baseUrl}}/Transaction/transferPlayPoint"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "play_point_qty": 1,
        "reciverCardNo": "1000000002",
        "senderCardNo": "1000000001"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
