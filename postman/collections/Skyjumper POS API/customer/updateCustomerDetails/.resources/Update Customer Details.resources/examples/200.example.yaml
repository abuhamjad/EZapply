$kind: http-example
request:
  url: "{{baseUrl}}/customer/updateCustomerDetails"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "address": "123 Main St",
        "dob": "1990-01-01",
        "email": "employee@example.com",
        "first_name": "John",
        "gender": "M",
        "id": 1,
        "last_name": "Doe",
        "mobile": "9876543210"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
