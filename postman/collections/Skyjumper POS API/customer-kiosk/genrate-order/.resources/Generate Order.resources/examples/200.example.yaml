$kind: http-example
request:
  url: "{{baseUrl}}/customer-kiosk/genrate-order"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 100,
        "order_type": "",
        "order_type_id": 1,
        "quantity": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
