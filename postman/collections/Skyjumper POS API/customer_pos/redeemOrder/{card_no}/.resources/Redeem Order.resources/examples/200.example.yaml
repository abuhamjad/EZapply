$kind: http-example
request:
  url: "{{baseUrl}}/customer_pos/redeemOrder/:card_no"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    card_no: ""
  body:
    type: json
    content: |-
      {
        "product_id": 1
      }
