$kind: http-request
description: Verifies OTP and returns a JWT (saved to the `token` collection variable) plus an RSA-encrypted `userInfo` blob. In MODE=development, otp is hardcoded to 123456.
url: "{{baseUrl}}/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mobile": "9999999999",
      "otp": "123456"
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Verify OTP (login).resources/examples
order: 1000
