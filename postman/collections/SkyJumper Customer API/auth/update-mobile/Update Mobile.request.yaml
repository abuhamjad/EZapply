$kind: http-request
description: Auth required. Confirms the OTP from send-verification-otp and updates the customer's mobile number.
url: "{{baseUrl}}/auth/update-mobile"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mobile": "9999999999",
      "otp": "123456"
    }
settings: {}
examples: ./.resources/Update Mobile.resources/examples
order: 1000
