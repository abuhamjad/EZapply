$kind: http-request
description: Auth required. Sends an OTP to the new mobile number before it is updated on the logged-in customer's profile.
url: "{{baseUrl}}/auth/send-verification-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mobile": "9999999999"
    }
settings: {}
examples: ./.resources/Send Verification OTP (mobile change).resources/examples
order: 1000
