$kind: http-request
description: Auth required. Multipart form update of the logged-in customer's profile. `profile` is an optional image file uploaded to S3. `pincode` triggers server-side city/state lookup. All fields optional; validated by updateCustomerValidator.
url: "{{baseUrl}}/customer/update"
method: PUT
headers:
  Content-Type: multipart/form-data
body:
  type: formdata
  content:
    - type: text
      key: address
      value: 123 Main Street
    - type: text
      key: date_of_birth
      value: 2000-01-01
    - type: text
      key: email
      value: john.doe@example.com
    - type: text
      key: first_name
      value: John
    - type: text
      key: gender
      value: male
    - type: text
      key: last_name
      value: Doe
    - type: text
      key: mobile
      value: "{{mobile}}"
    - type: text
      key: pincode
      value: "110001"
    - type: file
      key: profile
      src: []
settings: {}
examples: ./.resources/Update Customer.resources/examples
order: 1000
