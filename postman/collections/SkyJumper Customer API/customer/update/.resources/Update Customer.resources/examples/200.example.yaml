$kind: http-example
request:
  url: "{{baseUrl}}/customer/update"
  method: PUT
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: formdata
    content:
      - type: text
        key: address
        value: 123 Main Street
      - type: text
        key: date_of_birth
        value: 2000-01-01
      - type: text
        key: email
        value: john.doe@example.com
      - type: text
        key: first_name
        value: John
      - type: text
        key: gender
        value: male
      - type: text
        key: last_name
        value: Doe
      - type: text
        key: mobile
        value: "{{mobile}}"
      - type: text
        key: pincode
        value: "110001"
      - type: file
        key: profile
        src: []
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
