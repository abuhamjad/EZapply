$kind: http-request
description: "Multi-step party booking wizard. `step_no` drives which SP_PartyBooking step runs server-side; `step_no: 5` finalizes billing (data should include party_id, type: 'advance'|'final', amount). Adjust `data` contents per step."
url: "{{baseUrl}}/party/book-party"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "data": {
        "booking_date": "2026-08-01",
        "location_id": "1",
        "party_id": "1",
        "start_time": 840
      },
      "step_no": 1
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Book Party (step).resources/examples
order: 1000
