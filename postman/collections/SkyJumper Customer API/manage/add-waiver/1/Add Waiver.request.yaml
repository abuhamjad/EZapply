$kind: http-request
description: Auth required. Adds a waiver (e.g. for a child) linked to the customer_id path param. last_name, gender, date_of_birth are optional.
url: "{{baseUrl}}/manage/add-waiver/1"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "date_of_birth": "2015-06-01",
      "first_name": "John",
      "gender": "male",
      "last_name": "Doe",
      "phone_number": "9999999999"
    }
settings: {}
examples: ./.resources/Add Waiver.resources/examples
order: 1000
