$kind: http-example
request:
  url: "{{baseUrl}}/manage/add-waiver/1"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "date_of_birth": "2015-06-01",
        "first_name": "John",
        "gender": "male",
        "last_name": "Doe",
        "phone_number": "9999999999"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
