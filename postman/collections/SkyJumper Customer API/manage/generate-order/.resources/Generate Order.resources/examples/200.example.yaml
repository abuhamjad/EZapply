$kind: http-example
request:
  url: "{{baseUrl}}/manage/generate-order"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 500,
        "details": [],
        "firstname": "John",
        "order_type": "Product",
        "order_type_id": 1,
        "productinfo": "Product Purchase",
        "quantity": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
