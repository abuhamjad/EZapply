$kind: http-example
request:
  url: "{{baseUrl}}/manage/transfer-point"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "from_card_id": "1",
        "points": 100,
        "to_mobile": "9888888888"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
