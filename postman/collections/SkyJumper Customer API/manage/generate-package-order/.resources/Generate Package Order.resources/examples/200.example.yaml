$kind: http-example
request:
  url: "{{baseUrl}}/manage/generate-package-order"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 999,
        "firstname": "John",
        "location_id": "1",
        "package_id": 1,
        "productinfo": "Package Purchase",
        "quantity": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
