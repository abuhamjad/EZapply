$kind: http-request
description: Auth required. Creates a pending package order via SP_purchase_package_order and returns a payment hash. Adjust body fields to match the package/combo being purchased.
url: "{{baseUrl}}/manage/generate-package-order"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 999,
      "firstname": "John",
      "location_id": "1",
      "package_id": 1,
      "productinfo": "Package Purchase",
      "quantity": 1
    }
settings: {}
examples: ./.resources/Generate Package Order.resources/examples
order: 1000
