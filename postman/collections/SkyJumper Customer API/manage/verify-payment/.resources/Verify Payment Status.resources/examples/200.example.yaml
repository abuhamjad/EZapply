$kind: http-example
request:
  url: "{{baseUrl}}/manage/verify-payment"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "data": "<AES-encrypted JSON string: { customer_order_id: number, payment_id: string, order_type: string }>"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
