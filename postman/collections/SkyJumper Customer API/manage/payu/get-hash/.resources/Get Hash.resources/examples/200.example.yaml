  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": "1000",
        "email": "test@example.com",
        "firstname": "Test User",
        "productinfo": "Recharge Purchase",
        "txnid": "txn_1751009542404"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
