$kind: http-example
request:
  url: "{{baseUrl}}/manage/payu/addtocart"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "cart_guid": "11111111-1111-1111-1111-111111111111",
        "customer_id": "1",
        "data": [
          {
            "product_id": 1,
            "qty": 2
          }
        ],
        "product_type": "food"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
