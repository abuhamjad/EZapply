$kind: http-example
request:
  url: "{{baseUrl}}/manage/payu/updateCart"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "cart_id": 1,
        "qty": 3,
        "type": "update"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
