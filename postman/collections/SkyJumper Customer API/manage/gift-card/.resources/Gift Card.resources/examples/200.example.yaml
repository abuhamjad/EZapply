$kind: http-example
request:
  url: "{{baseUrl}}/manage/gift-card"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 500,
        "email": "recipient@example.com",
        "first_name": "Jane",
        "gift_type": "play_points",
        "last_name": "Smith",
        "mobile": "9888888888",
        "productinfo": "Gift Card Purchase",
        "qty": 1,
        "type": "new_card",
        "type_id": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
