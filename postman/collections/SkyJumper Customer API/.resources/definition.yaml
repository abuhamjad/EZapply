$kind: collection
description: |-
  Customer-facing API for SkyJumper (auth, orders/payments, cards, waivers, feedback, party booking, kiosk).

  Base path mounted at `/api/customer/v1` (see app.js). Most routes require a Bearer JWT obtained from `/auth/verify-otp`.

  Set `base_url` in the environment (default `http://localhost:3005/api/customer/v1`). After calling Verify OTP, the token is auto-saved to the `token` collection variable via a test script.
variables:
  baseUrl: http://localhost:3005/api/customer/v1
auth:
  - id: ffc551bc-1b60-46b3-8126-96fbf641a237
    type: bearer
    name: bearer auth
    credentials:
      token: "{{bearerToken}}"
